name: Actions 😎

on:
  pull_request: {}
  push: { branches: [main] }

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    # A per-step timeout doesn't bound an action's own implicit post-run
    # cleanup step (e.g. actions/cache@v4's cache-save), which is exactly
    # what's been observed hanging here - real work finishes (build
    # succeeds, cleanup logs run) but the job status never flips to
    # completed. A job-level timeout is the only thing that bounds that
    # too, converting a silent multi-hour hang into a clear, fast failure.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from mise.toml
        id: node
        run: echo "version=$(grep -E '^node\s*=' mise.toml | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Install package manager (from package.json)
        run: |
          corepack enable
          corepack install

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Resolve yarn cache folder
        id: yarn-config
        run: echo "cacheFolder=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore yarn install cache (node_modules + cacheFolder + install-state)
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ${{ steps.yarn-config.outputs.cacheFolder }}
            .yarn/install-state.gz
          key: yarn-${{ runner.os }}-node${{ steps.node.outputs.version }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-node${{ steps.node.outputs.version }}-

      - name: Install deps
        run: |
          case "$(yarn --version)" in 1.*) echo 'expected up-to-date yarn version'; exit 1 ;; esac
          yarn install --immutable

      - name: Format
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build || { echo 'build command should always succeed'; exit 61; }

  checkEnv:
    name: Check Env 🔎
    runs-on: ubuntu-latest
    outputs:
      usernameExists: ${{ steps.checkUsername.outputs.usernameExists }}
    steps:
      - id: checkUsername
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        if: env.STEAM_USERNAME != ''
        run: echo "usernameExists=true" >> "$GITHUB_OUTPUT"

  testDeploy:
    name: Deploy to Steam ☁
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only run if secrets are available (e.g. not from PRs from forked repos)
    needs: [checkEnv]
    if: needs.checkEnv.outputs.usernameExists == 'true'

    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p build/StandaloneWindows64
          touch build/StandaloneWindows64/steam-deploy-test.txt
          mkdir -p build/StandaloneLinux64
          touch build/StandaloneLinux64/steam-deploy-test.txt

      - name: Deploy
        uses: ./
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          password: ${{ secrets.STEAM_PASSWORD }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ secrets.TEST_APP_ID }}
          buildDescription: v0.0.1
          rootPath: build
          depot1Path: StandaloneWindows64
          depot2Path: StandaloneLinux64
          releaseBranch: prerelease

      # Regression test for the old action's #79: runnable more than once in
      # the same job, and must not leave root-owned files behind.
      - name: Deploy again
        uses: ./
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          password: ${{ secrets.STEAM_PASSWORD }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ secrets.TEST_APP_ID }}
          buildDescription: v0.0.1
          rootPath: build
          depot1Path: StandaloneWindows64
          depot2Path: StandaloneLinux64
          releaseBranch: prerelease

      - name: Workspace is clean and writable
        run: |
          test -z "$(find . -path ./.git -prune -o \( ! -writable -o ! -uid "$(id -u)" \) -print)"
